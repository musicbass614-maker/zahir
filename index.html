<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SİSTEM ELE GEÇİRİLDİ</title>
    <style>
        body {
            background-color: black;
            color: red;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: none;
            user-select: none; /* Metin seçimini engelle */
            -webkit-user-select: none;
        }

        #main-content {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .warning-text {
            position: absolute;
            width: 100%;
            font-size: 1.8rem;
            font-weight: 900;
            text-shadow: 0 0 10px red, 0 0 20px darkred;
            z-index: 10;
        }

        #title {
            top: 5%;
            color: red;
            font-size: 2.5rem;
            animation: shake 0.1s infinite;
        }

        #status1 {
            top: 20%;
            color: yellow;
            animation: flash 0.2s infinite;
        }

        #status2 {
            top: 30%;
            color: orange;
            animation: flash 0.3s infinite alternate;
        }

        #timer {
            top: 40%;
            color: red;
            font-size: 3rem;
            animation: zoom 0.5s infinite alternate;
            z-index: 10;
        }

        #granny {
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 100vh;
            background-image: url('https://i.pinimg.com/736x/8a/e4/22/8ae422f2bc08ed6a8617eb6d9a144d4e.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: 5;
            animation: approach 2s infinite; 
            mix-blend-mode: screen; 
            opacity: 0.8;
        }

        @keyframes flash {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes zoom {
            0% { transform: scale(0.8); }
            100% { transform: scale(1.2); }
        }

        @keyframes approach {
            0% { transform: translateX(-50%) scale(0.5); filter: blur(5px); }
            50% { transform: translateX(-50%) scale(1.2); filter: blur(0px); }
            100% { transform: translateX(-50%) scale(2); filter: blur(10px); opacity: 0; }
        }
        
        body.glitch {
            animation: glitch-anim 0.2s infinite;
        }
        
        @keyframes glitch-anim {
            0% { filter: invert(0); transform: translate(0,0); }
            20% { filter: invert(1); transform: translate(-5px, 5px); }
            40% { filter: invert(0); transform: translate(5px, -5px); }
            60% { filter: invert(1); transform: translate(-5px, -5px); }
            80% { filter: invert(0); transform: translate(5px, 5px); }
            100% { filter: invert(0); transform: translate(0,0); }
        }

        /* Ses açma zorunluluğu için görünmez katman */
        #unmute-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            background: transparent;
        }
    </style>
</head>
<body class="glitch">

    <div id="unmute-overlay"></div>

    <div id="main-content">
        <div id="title" class="warning-text">Zahir VİRÜS</div>
        <div id="status1" class="warning-text">TELEFON ELE GEÇİRİLİYOR...</div>
        <div id="status2" class="warning-text">NUMARALAR ELE GEÇİRİLİYOR 1-100</div>
        <div id="timer" class="warning-text">100</div>
        
        <div id="granny"></div>
        
        <!-- Ses Kaynağı -->
        <audio id="horror-sound" loop preload="auto">
            <source src="https://www.myinstants.com/media/sounds/granny-scream.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const timerElement = document.getElementById('timer');
        const audio = document.getElementById('horror-sound');
        const body = document.body;
        const overlay = document.getElementById('unmute-overlay');
        let timeLeft = 100;

        // 1. TAM EKRAN VE SESİ FULLEME MANTIĞI
        // Kullanıcı ekrana ilk dokunduğunda çalışır
        function startHorror() {
            // Tam ekran yap (Tarayıcı çubuklarını gizler)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => console.log("Tam ekran hatası:", err));
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }

            // Sesi %100 yap ve oynat
            audio.volume = 1.0; 
            audio.play().catch(e => console.log("Ses engellendi:", e));

            // Ekranın kararmasını engelle (Ekran açık kalsın)
            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch(err => console.log(err));
            }

            // Overlay'i kaldır ki bir daha tıklamaya gerek kalmasın
            overlay.style.display = 'none';
            
            // Dinleyicileri temizle
            document.removeEventListener('click', startHorror);
            document.removeEventListener('touchstart', startHorror);
        }

        // Tıklama veya dokunma algıla
        document.addEventListener('click', startHorror);
        document.addEventListener('touchstart', startHorror);

        // 2. GERİ SAYIM
        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.innerText = "BANLANDIN!";
                timerElement.style.fontSize = "4rem";
                timerElement.style.color = "darkred";
            }
        }, 1000);

        // 3. SÜREKLİ YAKLAŞAN YARATIK EFEKTİ
        setInterval(() => {
            const granny = document.getElementById('granny');
            const randomScale = 1 + Math.random() * 3;
            const randomX = (Math.random() - 0.5) * 40;
            const randomY = (Math.random() - 0.5) * 40;
            
            granny.style.transform = `translateX(calc(-50% + ${randomX}px)) scale(${randomScale})`;
            granny.style.filter = `blur(${Math.random() * 5}px)`;
            granny.style.opacity = 0.5 + Math.random() * 0.5;
            
            if(Math.random() > 0.6) {
                body.style.backgroundColor = "darkred";
                setTimeout(() => { body.style.backgroundColor = "black"; }, 100);
            }
        }, 150);

        // 4. GERİ TUŞUNU ENGELLEME (Android)
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1); // Geri gitmesini engelle
        };
    </script>
</body>
</html>
